name: reelhub

services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    container_name: reelhub-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/db:/data/db
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/videos:/data/videos
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/temp:/data/temp
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/logs:/data/logs
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/backups:/data/backups
      - ${STORAGE_DATA_PATH:-/srv/reelhub}/browser-profiles:/data/browser-profiles
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    labels:
      com.reelhub.managed: "true"
    networks:
      - reelhub_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  browser-worker:
    profiles: ["browser"]
    build:
      context: ./apps/browser-worker
      dockerfile: Dockerfile
    container_name: reelhub-browser-worker
    restart: unless-stopped
    environment:
      - CORE_API_URL=http://core:3000
      - BROWSER_WORKER_SECRET=${BROWSER_WORKER_SECRET}
    volumes:
      - /srv/reelhub/browser-profiles:/data/browser-profiles
      - /srv/reelhub/logs:/data/logs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    shm_size: 1gb
    init: true
    security_opt:
      - no-new-privileges:true
    labels:
      com.reelhub.managed: "true"
    networks:
      - reelhub_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  reelhub_net:
    name: reelhub_net
    driver: bridge
    labels:
      com.reelhub.managed: "true"

